[package]
name = "rustida-loader"
version = "0.1.0"
edition = "2024"
description = "Binary loading and address-space construction for RustIDA"
publish = false

[dependencies]
rustida-core = { path = "../rustida-core" }
goblin = "0.10"
iced-x86 = "1.22"
object = "0.41"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"