[package]
name = "rustida"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "RustIDA — an independent, open-source reverse-engineering tool"
publish = false

[dependencies]
rustida-core = { path = "crates/rustida-core" }
rustida-loader = { path = "crates/rustida-loader" }
rustida-project = { path = "crates/rustida-project" }
rustida-gui = { path = "crates/rustida-gui" }
eframe = { version = "0.37", features = ["glow", "__screenshot"] }
egui = "0.37"

[workspace]
resolver = "3"
members = [
    "crates/rustida-core",
    "crates/rustida-loader",
    "crates/rustida-project",
    "crates/rustida-gui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
repository = "https://github.com/rustida/rustida"

[workspace.dependencies]
thiserror = "2"
goblin = "0.10"
iced-x86 = "1.22"
object = "0.41"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
egui = "0.37"
eframe = "0.37"